# Local PostgreSQL for development. Tests use a separate throwaway database (see README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sipc
      POSTGRES_PASSWORD: sipc
      POSTGRES_DB: sipc
    ports:
      - "5432:5432"
    volumes:
      - sipc-pgdata:/var/lib/postgresql/data

  engine:
    build: ./engine
    environment:
      ENGINE_API_KEY: ${ENGINE_API_KEY:?set ENGINE_API_KEY}
    ports:
      - "8000:8000"

volumes:
  sipc-pgdata:
